name: SystemC backend Linux binary

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run CIRCT tests before packaging
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'systemc-backend-*'

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CIRCT and LLVM
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake g++ make ninja-build python3 zlib1g-dev libzstd-dev \
            verilator libsystemc-dev

      - name: Configure
        run: |
          cmake -G Ninja -S llvm/llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_EXTERNAL_PROJECTS=circt \
            -DLLVM_EXTERNAL_CIRCT_SOURCE_DIR="$PWD" \
            -DLLVM_TARGETS_TO_BUILD=host \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DCIRCT_SLANG_FRONTEND_ENABLED=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"

      - name: Build
        run: |
          cmake --build build \
            --target circt-opt circt-translate circt-verilog FileCheck count not \
            --parallel 4

      - name: Preserve compiled tools
        uses: actions/upload-artifact@v4
        with:
          name: circt-systemc-tools-${{ github.sha }}
          path: |
            build/bin/circt-opt
            build/bin/circt-translate
            build/bin/circt-verilog
            build/bin/FileCheck
            build/bin/count
            build/bin/not

      - name: Test
        if: inputs.run_tests || github.ref_type == 'tag'
        run: |
          build/bin/llvm-lit -sv \
            test/Dialect/HW/extract-hierarchy-slice.mlir \
            test/Conversion/HWToSystemC \
            test/Dialect/SystemC \
            test/Target/ExportSystemC
          CIRCT_BUILD_DIR="$PWD/build" \
            bash test/Target/ExportSystemC/verilated-mixed/run.sh

      - name: Install and package
        run: |
          package_root="circt-systemc-${GITHUB_SHA}-linux-x86_64"
          mkdir -p "$package_root/bin"
          cp build/bin/circt-opt build/bin/circt-translate \
            build/bin/circt-verilog "$package_root/bin/"
          cp LICENSE README.md "$package_root/"
          cat > "$package_root/BUILD_INFO.txt" <<EOF
          source=https://github.com/${GITHUB_REPOSITORY}
          revision=${GITHUB_SHA}
          runner=ubuntu-24.04-x86_64
          validation=SystemC dialect/HW-to-SystemC/ExportSystemC lit tests plus Verilator mixed integration
          EOF
          ldd "$package_root/bin/circt-opt"
          ldd "$package_root/bin/circt-translate"
          ldd "$package_root/bin/circt-verilog"
          tar -czf "$package_root.tar.gz" "$package_root"
          sha256sum "circt-systemc-${GITHUB_SHA}-linux-x86_64.tar.gz" > "circt-systemc-${GITHUB_SHA}-linux-x86_64.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: circt-systemc-linux-x86_64
          path: |
            circt-systemc-*.tar.gz
            circt-systemc-*.sha256

      - name: Upload release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            circt-systemc-*.tar.gz
            circt-systemc-*.sha256
